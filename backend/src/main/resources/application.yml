server:
  port: 8080

spring:
  application:
    name: spares-billing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spares_billing}
    username: ${DB_USER:spares}
    password: ${DB_PASSWORD:spares_dev_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
    locations: classpath:db/migration