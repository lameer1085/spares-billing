server:
  port: 8080  #8080 is the server's listening port. It is not your database port.

spring:
  application:
    name: spares-billing  # application the name spares-billing.This name can be useful in application logs, monitoring, and integrations with other services.
  datasource: # datasource is the configuration Spring uses to obtain database connections.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spares_billing} # Where the database is located and which database to connect
    username: ${DB_USER:spares} #Database account used to connect
    password: ${DB_PASSWORD:spares_dev_pass} #Password for the database account
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
    locations: classpath:db/migration # Where the database migration scripts are located

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-in-production-min-32-bytes}
    expiration-minutes: 480
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  initial-owner:
    username: ${INITIAL_OWNER_USERNAME:owner}
    password: ${INITIAL_OWNER_PASSWORD:ChangeMe@123}
  billing:
    staff-max-discount-percent: 10